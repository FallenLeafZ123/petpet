<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 活塞 PetPet 生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 8px; font-size: 26px; }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 13px; }
        
        .upload-area {
            width: 100%;
            max-width: 400px;
            height: 180px;
            border: 3px dashed #444;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            position: relative;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #00d4aa;
            background: rgba(0, 212, 170, 0.05);
        }
        .upload-area input { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            cursor: pointer;
        }
        .upload-icon { font-size: 40px; margin-bottom: 8px; pointer-events: none; }
        .upload-text { font-size: 15px; color: #999; pointer-events: none; }
        
        .controls {
            width: 100%;
            max-width: 400px;
            background: #16213e;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .control-group { margin-bottom: 14px; }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            color: #ccc;
        }
        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #0f3460;
            border-radius: 3px;
            outline: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00d4aa;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .preview-area {
            width: 100%;
            max-width: 400px;
            min-height: 200px;
            background: #16213e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .preview-area img { max-width: 100%; display: block; }
        .preview-placeholder { color: #555; font-size: 14px; }
        
        .btn {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            background: #00d4aa;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-bottom: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .status { color: #00d4aa; font-size: 13px; min-height: 20px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>🔧 活塞 PetPet</h1>
    <p class="subtitle">网站作者:FallenLeaf_Z</p>
    
    <div class="upload-area" id="dropZone">
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击或拖拽上传图片</div>
    </div>
    
    <div class="controls" id="controls">
        <div class="control-group">
            <label>
                <span>图片缩放 (Scale)</span>
                <span id="scaleVal">1.0</span>
            </label>
            <input type="range" id="scale" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>
                <span>动画速度 (FPS)</span>
                <span id="fpsVal">20</span>
            </label>
            <input type="range" id="fps" min="5" max="60" step="5" value="20">
        </div>
    </div>
    
    <div class="preview-area" id="previewArea">
        <div class="preview-placeholder">预览区域</div>
    </div>
    
    <button class="btn" id="generateBtn" disabled>⚡ 生成 GIF</button>
    <a class="btn" id="downloadBtn" style="display:none;">⬇️ 下载 GIF</a>
    <p class="status" id="status">⏳ 正在加载 WASM...</p>

    <script type="module">
        import init, { make_petpet } from './pkg/petpet.js';
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const previewArea = document.getElementById('previewArea');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        
        let currentFile = null;
        let wasmReady = false;
        
        init().then(() => {
            wasmReady = true;
            status.textContent = '✅ 准备就绪，请上传图片';
        }).catch(e => {
            console.error('WASM init failed:', e);
            status.textContent = '⚠️ WASM 加载失败，但上传功能仍可用';
            generateBtn.disabled = true;
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                status.textContent = '❌ 请上传图片文件 (PNG/JPG/WebP)';
                return;
            }
            currentFile = file;
            controls.style.display = 'block';
            generateBtn.disabled = !wasmReady;
            status.textContent = `📷 已选择: ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewArea.innerHTML = `<img src="${e.target.result}" style="max-width:100%;border-radius:8px;">`;
            };
            reader.readAsDataURL(file);
        }
        
        document.getElementById('scale').addEventListener('input', (e) => {
            document.getElementById('scaleVal').textContent = e.target.value;
        });
        document.getElementById('fps').addEventListener('input', (e) => {
            document.getElementById('fpsVal').textContent = e.target.value;
        });
        
        generateBtn.addEventListener('click', async () => {
            if (!currentFile || !wasmReady) return;
            
            generateBtn.disabled = true;
            downloadBtn.style.display = 'none';
            status.textContent = '⏳ WASM 生成中...';
            
            try {
                const arrayBuffer = await currentFile.arrayBuffer();
                const inputBytes = new Uint8Array(arrayBuffer);
                
                // ========== 修改：读取滑块值并传给 WASM ==========
                const scale = parseFloat(document.getElementById('scale').value);
                const fps = parseInt(document.getElementById('fps').value);
                const gifBytes = make_petpet(inputBytes, scale, fps);
                
                const blob = new Blob([gifBytes], { type: 'image/gif' });
                const url = URL.createObjectURL(blob);
                
                previewArea.innerHTML = `<img src="${url}" style="max-width:100%;border-radius:8px;">`;
                
                downloadBtn.href = url;
                downloadBtn.download = 'petpet.gif';
                downloadBtn.style.display = 'block';
                status.textContent = '✅ 生成完成！点击下载保存';
            } catch (e) {
                status.textContent = '❌ 生成失败，请检查图片格式或查看 F12 控制台';
                console.error('WASM Error:', e);
            } finally {
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
